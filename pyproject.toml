[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-rag"
version = "0.2.0"
description = "RAG léxico BM25 multi-fuente sobre notas Markdown/Obsidian"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabo" }]
dependencies = []

[project.scripts]
omni-rag = "omni_rag.cli:main"

[tool.setuptools]
packages = ["omni_rag"]
